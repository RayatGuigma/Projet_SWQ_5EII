name: Build & Run unit tests 
#declenchement auto et manuel
on:
  push:
    branches: 
      - Version1
      - main
  workflow_dispatch:

jobs:
  tests:
    name: Compilation et tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Build project
        run: cargo build --all

      - name: Run tests
        run: cargo test --all
